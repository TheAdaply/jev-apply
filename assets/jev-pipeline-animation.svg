<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <title>Application pipeline schematic</title>
  <desc>Learn saved material, resolve fields with code and Jev, draft only grounded prose with permission, then fill and read back. Missing personal facts remain questions.</desc>
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #0d1117; rx: 12px; }
    .panel-blue { fill: #161b22; stroke: #1f6feb; stroke-width: 1.5; rx: 8px; filter: url(#shadow); }
    .panel-green { fill: #161b22; stroke: #238636; stroke-width: 1.5; rx: 8px; filter: url(#shadow); }
    .panel-jev { fill: #161b22; stroke: #8957e5; stroke-width: 1.8; rx: 8px; filter: url(#shadow); }
    .panel-cyan { fill: #161b22; stroke: #388bfd; stroke-width: 1.5; rx: 8px; filter: url(#shadow); }
    .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #8b949e; text-transform: uppercase; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #c9d1d9; }
    .code-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #79c0ff; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; fill: #8b949e; }
    .accent-green { fill: #3fb950; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 10px; font-weight: 600; }
    .accent-purple { fill: #d2a8ff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 700; }
    .accent-blue { fill: #58a6ff; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 10px; }
    .pill-bg { fill: #238636; rx: 3px; }
    .pill-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; }
  </style>

  <rect width="850" height="240" class="bg" />

  <!-- Stage 1: Learn (Input Blue) -->
  <rect x="20" y="30" width="145" height="180" class="panel-blue" />
  <rect x="20" y="30" width="145" height="180" fill="url(#blueGlow)" rx="8"/>
  <text x="35" y="55" class="header-text" fill="#58a6ff">Stage 1</text>
  <text x="35" y="75" class="title-text">Onboarding</text>
  <text x="35" y="93" class="code-text">learn.mjs</text>
  <line x1="35" y1="105" x2="150" y2="105" stroke="#21262d" stroke-width="1"/>
  <text x="35" y="123" class="meta-text">--resume cv.pdf</text>
  <text x="35" y="141" class="meta-text">--links linkedin,gh</text>
  <text x="35" y="159" class="meta-text">Extracts facts/gaps</text>
  <text x="35" y="181" class="code-text" fill="#8b949e">Echoes &lt;= 6 lines</text>

  <!-- Flow 1 -->
  <path d="M 165 120 L 185 120" stroke="#30363d" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="165" cy="120" r="4" fill="#58a6ff">
    <animate attributeName="cx" from="165" to="185" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Stage 2: Memory (Security Green) -->
  <rect x="185" y="30" width="150" height="180" class="panel-green" />
  <rect x="185" y="30" width="150" height="180" fill="url(#greenGlow)" rx="8"/>
  <text x="200" y="55" class="header-text" fill="#3fb950">Stage 2 (0700 Priv)</text>
  <text x="200" y="75" class="title-text" fill="#3fb950">Private Memory</text>
  <text x="200" y="89" class="code-text">~/.config/jev-apply/</text>
  <text x="200" y="102" class="code-text">memory/</text>
  <line x1="200" y1="105" x2="320" y2="105" stroke="#21262d" stroke-width="1"/>
  <text x="200" y="123" class="code-text">facts.yaml</text>
  <text x="200" y="141" class="code-text">preferences.yaml</text>
  <text x="200" y="159" class="code-text">answers.yaml (canon)</text>
  <rect x="200" y="174" width="115" height="18" class="pill-bg" />
  <text x="208" y="186" class="pill-text">ZERO GIT REPO DATA</text>

  <!-- Flow 2 -->
  <path d="M 335 120 L 355 120" stroke="#30363d" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="335" cy="120" r="4" fill="#3fb950">
    <animate attributeName="cx" from="335" to="355" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Stage 3: Jev Decider (System One Purple) -->
  <rect x="355" y="20" width="160" height="200" class="panel-jev" />
  <rect x="355" y="20" width="160" height="200" fill="url(#purpleGlow)" rx="8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="370" y="48" class="header-text" fill="#d2a8ff">Stage 3</text>
  <text x="370" y="68" class="accent-purple">Planner &amp; Jev</text>
  <text x="370" y="86" class="code-text">apply.mjs --url</text>
  <line x1="370" y1="98" x2="500" y2="98" stroke="#30363d" stroke-width="1"/>
  <text x="370" y="116" class="meta-text">Fetch Form Schema</text>
  <text x="370" y="134" class="code-text" fill="#d2a8ff">jev-1.13.0 Choice</text>
  <text x="370" y="152" class="meta-text">Grounded Essay Writer</text>
  <text x="370" y="170" class="meta-text">p.auto_draft Resolution</text>
  <text x="370" y="192" class="accent-green">Unknown facts? Ask.</text>

  <!-- Flow 3 -->
  <path d="M 515 120 L 535 120" stroke="#30363d" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="515" cy="120" r="4" fill="#a371f7">
    <animate attributeName="cx" from="515" to="535" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Stage 4: Playwright CDP (Execution Blue) -->
  <rect x="535" y="30" width="150" height="180" class="panel-blue" />
  <rect x="535" y="30" width="150" height="180" fill="url(#blueGlow)" rx="8"/>
  <text x="550" y="55" class="header-text" fill="#58a6ff">Stage 4</text>
  <text x="550" y="75" class="title-text">CDP Executor</text>
  <text x="550" y="93" class="code-text">Playwright CDP</text>
  <line x1="550" y1="105" x2="670" y2="105" stroke="#21262d" stroke-width="1"/>
  <text x="550" y="123" class="meta-text">Dedicated Chrome Profile</text>
  <text x="550" y="141" class="meta-text">Native Form Fill</text>
  <text x="550" y="159" class="code-text">DOM Readback Check</text>
  <text x="550" y="181" class="accent-blue">trace.jsonl Verified</text>

  <!-- Flow 4 -->
  <path d="M 685 120 L 705 120" stroke="#30363d" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="685" cy="120" r="4" fill="#388bfd">
    <animate attributeName="cx" from="685" to="705" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Stage 5: Outcome Contract (Contract Cyan) -->
  <rect x="705" y="30" width="125" height="180" class="panel-cyan" />
  <rect x="705" y="30" width="125" height="180" fill="url(#cyanGlow)" rx="8"/>
  <text x="718" y="55" class="header-text" fill="#79c0ff">Stage 5</text>
  <text x="718" y="75" class="title-text" fill="#79c0ff">4-Status JSON</text>
  <line x1="718" y1="87" x2="818" y2="87" stroke="#21262d" stroke-width="1"/>
  <text x="718" y="105" class="accent-green">submitted</text>
  <text x="718" y="123" class="code-text">ready_to_submit</text>
  <text x="718" y="141" class="code-text" fill="#d29922">needs_user</text>
  <text x="718" y="159" class="code-text" fill="#f85149">blocked</text>
  <text x="718" y="181" class="meta-text">Exit 0 to Host Agent</text>
</svg>
