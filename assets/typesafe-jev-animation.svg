<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <title>Jev selection and browser readback schematic</title>
  <desc>Illustrative flow, not a measured run. Jev chooses among saved candidates or none_of_these. Only resolved answers reach the browser; unknown facts stay open.</desc>
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #0d1117; rx: 12px; }
    .panel-blue { fill: #161b22; stroke: #1f6feb; stroke-width: 1.5; rx: 8px; filter: url(#shadow); }
    .panel-purple { fill: #161b22; stroke: #8957e5; stroke-width: 1.8; rx: 8px; filter: url(#shadow); }
    .panel-green { fill: #161b22; stroke: #238636; stroke-width: 1.5; rx: 8px; filter: url(#shadow); }
    .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #8b949e; text-transform: uppercase; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .code-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #79c0ff; }
    .accent-green { fill: #3fb950; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 600; }
    .accent-purple { fill: #d2a8ff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; }
    .pill-bg { fill: #238636; rx: 4px; }
    .pill-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; }
    .pulse-dot { fill: #a371f7; }
  </style>

  <rect width="850" height="240" class="bg" />

  <!-- Panel 1: Input State -->
  <rect x="25" y="30" width="230" height="180" class="panel-blue" />
  <rect x="25" y="30" width="230" height="180" fill="url(#blueGlow)" rx="8"/>
  <text x="42" y="55" class="header-text" fill="#58a6ff">1. Input State &amp; Canon</text>
  <text x="42" y="78" class="title-text">ATS Field Question</text>
  <text x="42" y="96" class="code-text">A question on the form</text>
  <line x1="42" y1="110" x2="237" y2="110" stroke="#21262d" stroke-width="1"/>
  <text x="42" y="130" class="title-text">Candidate Record</text>
  <text x="42" y="148" class="code-text">Saved facts and answers</text>
  <text x="42" y="166" class="code-text">Explicit choice candidates</text>
  <text x="42" y="190" class="code-text" fill="#8b949e">Schematic, not a measured run</text>

  <!-- Flow Connector 1 -->
  <path d="M 255 120 L 335 120" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="255" cy="120" r="5" class="pulse-dot" fill="#58a6ff">
    <animate attributeName="cx" from="255" to="335" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Panel 2: TypeSafe Jev Decider -->
  <rect x="335" y="20" width="250" height="200" class="panel-purple" />
  <rect x="335" y="20" width="250" height="200" fill="url(#purpleGlow)" rx="8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="355" y="48" class="header-text" fill="#d2a8ff">2. TypeSafe Jev Decider</text>
  <text x="355" y="72" class="accent-purple">System One Model</text>
  <text x="355" y="90" class="code-text" fill="#c9d1d9">JEV_MODEL = "jev-1.13.0"</text>
  <line x1="355" y1="104" x2="565" y2="104" stroke="#30363d" stroke-width="1"/>
  <text x="355" y="124" class="title-text">Choose a saved candidate</text>
  <text x="355" y="142" class="code-text">Validate choice + probabilities</text>
  <text x="355" y="160" class="code-text">Exit Gate: none_of_these</text>
  <rect x="355" y="176" width="180" height="22" class="pill-bg" />
  <text x="367" y="191" class="pill-text">NO MATCH? LEAVE OPEN</text>

  <!-- Flow Connector 2 -->
  <path d="M 585 120 L 665 120" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4" />
  <circle cx="585" cy="120" r="5" class="pulse-dot" fill="#3fb950">
    <animate attributeName="cx" from="585" to="665" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Panel 3: Execution & Readback -->
  <rect x="665" y="30" width="160" height="180" class="panel-green" />
  <rect x="665" y="30" width="160" height="180" fill="url(#greenGlow)" rx="8"/>
  <text x="682" y="55" class="header-text" fill="#3fb950">3. DOM Readback</text>
  <text x="682" y="78" class="title-text">Decision Record</text>
  <text x="682" y="96" class="accent-green">Resolved answers</text>
  <text x="682" y="114" class="code-text">Unknowns: ask</text>
  <line x1="682" y1="126" x2="810" y2="126" stroke="#21262d" stroke-width="1"/>
  <text x="682" y="146" class="title-text">Playwright CDP</text>
  <text x="682" y="164" class="code-text">Fill + read back</text>
  <text x="682" y="184" class="code-text" fill="#3fb950">Log to trace.jsonl</text>
</svg>
