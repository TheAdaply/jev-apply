  - url: https://jobs.ashbyhq.com/openai/7322d344-9325-4a92-8445-0a2c4e9272f8/application
    company: openai
    family: research_engineer
    ats: ashby
    title: Research Engineer, Retrieval & Search, Applied Engineering
    questions: 20
    required: 14
    controls: [text, tel, file, date, radio, location, checkbox_single, long_option_list, eeo]
    notes: >-
      The only **date** control found on any fresh board (see `coverage.not_found` below):
      "When can you start a new role?", required, an Ashby `Date` field — the control that had no
      adapter branch until round 2 and that `classifyShape`'s date-class rung now reads. Expect
