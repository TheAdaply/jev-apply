  - url: https://job-boards.greenhouse.io/remotecom/jobs/7799283003
    company: remote-com
    family: product_manager
    ats: greenhouse
    title: GTM Product Manager
    questions: 23
    required: 17
    controls: [text, tel, file, react_select, long_option_list, textarea, dependent, hear_about, eeo]
