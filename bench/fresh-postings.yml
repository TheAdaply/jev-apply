# jev-apply — twelve postings the system has never seen, for the fresh-baseline capture
#
# Purpose: measure the runner on forms that no earlier round, no earlier shortlist and no earlier
# application touched — the "any form, including one never seen" case that `docs/POSTMORTEM.md`
# says the five judged rounds cannot answer, because every round after round 1 re-ran postings whose
# failure classes had already been patched. Consumed by `scripts/eval-shots.mjs --postings`
# (`src/bench/postings.mjs` reads `postings[]`); `controls` here is the inventory the live schema
# reported on the verification date, not a scoring expectation.
#
# How the list was built (2026-09-24):
#   1. Exclusion set, applied to *company* and to *URL*: every row of `bench/postings.yml` (together
#      -ai, baseten, linear, tenstorrent, cohere, elevenlabs, cloudflare, confluent, faire, deepl,
#      fireworks, figma, affirm, 1password), every row of `bench/ten-postings.yml` (together-ai,
#      tenstorrent, graphcore, scale-ai, modal, d-matrix, decagon, cerebras, mistral, snowflake),
#      every company named in `private/o1-candidates.md` (adds xai, anyscale, anthropic, isomorphic
#      labs, coreweave, databricks, wayve, stability ai, etched, speechmatics), and every slug under
#      `~/.config/jev-apply/applications/` (snowflake-deaebf03, mistral-ai-2ed434c7, cerebras-
#      d654a704, decagon-c1ac7d78, d-matrix-f36b38d8, modal-7db771eb, scale-ai-4488520005,
#      graphcore-8632581002, tenstorrent-4832276007, together-ai-5140763007, scale-ai-4534631005,
#      together-ai-4385540007, spacexai-4533894007, fireworks-fc3845e6, baseten-db6477fc,
#      baseten-7c9d2bb0, together-ai-5179372007, and the two `smoke-*` dirs). None of the twelve
#      companies below appears in any of those four sources.
#   2. Candidate boards came from `private/companies-seed.yml` + `corpus/companies-extra.yml`
#      (the provider/token map), minus the exclusion set, minus every Lever board (`detectAts`
#      supports greenhouse + ashby only). 222 live postings were then fetched through the repo's own
#      schema slice — `loadFormPlan` (`src/schema/index.mjs`) — and scored on control rarity.
#   3. Every row below was re-fetched through `loadFormPlan` on 2026-09-24 and returned a FormPlan,
#      so all twelve are open on that date. The six Greenhouse rows were additionally fetched as
#      served HTML: 200, zero redirects, `id="application-form"` present — hosted, not embedded.
#   4. Excluded on inspection: AI-usage attestation forms (Perplexity's application carries one on
#      every posting, so the whole board is out); postings located in India; embedded boards whose
#      `absolute_url` leaves `job-boards.greenhouse.io` (mongodb, asana, sambanova, robinhood's
#      canonical URL form is `boards.greenhouse.io/...?gh_jid=`, spotify/zoox/palantir = Lever).
#   5. Also excluded, deliberately: any posting already present in `corpus/` as a question-text
#      sample, because the canonical question bank was clustered from those labels. GitLab
#      8490477002, Gusto 7656216, Discord 8769799002 and Harvey d78083d9 were each dropped for a
#      same-template sibling on the same board for exactly that reason.
#
# Run rules: real profile (`~/.config/jev-apply`, CDP 9223), `--no-submit` on every child
# (`src/bench/shots.mjs:runFill` hardcodes the flag — there is no `--submit`), tab closed after its
# screenshots (`--close`). These are live employer forms and the user's real identity: the run
# fills, photographs and walks away.
#
# NOT personal data: every field below is public job-board metadata.

generated: 2026-09-24
verified: 2026-09-24          # all 12 fetched through loadFormPlan and confirmed open on this date
ats_supported: [greenhouse, ashby]

# Greenhouse first, then Ashby; within each ATS, ascending on the number of questions the live
# schema reported.
postings:
  - url: https://job-boards.greenhouse.io/twilio/jobs/7996774
    company: twilio
    family: ml_engineer
    ats: greenhouse
    title: Machine Learning Engineer
    questions: 15
    required: 13
    controls: [text, tel, file, checkbox_group, checkbox_single, react_select, location, eeo]
    notes: >-
      Non-US row one: `Remote - Ireland`, so `job.country` normalizes to IE and the work-auth pair
      must resolve from the user's IE answer, not their US one. Carries two *one-box* checkbox
      groups whose only option is the literal "Acknowledge" — one classified `policy_gate` (the
      Twilio privacy/processing notice) and one classified `company_specific` (the candidate
      guidelines confirmation), i.e. two near-identical controls that the classifier splits into
      two different gates; the `company_specific` one is the interesting half, because nothing in
      the store speaks to it. Plus a 9-box required "How did you hear about Twilio?" checkbox
      group and "What is the source of your right to work where this role is listed?", a 4-option
      react-select that is a personal fact and must `ask` when not on file.

  - url: https://job-boards.greenhouse.io/gitlab/jobs/8786095002
    company: gitlab
    family: backend
    ats: greenhouse
    title: Principal Engineer, Duo Agent Platform
    questions: 18
    required: 9
    controls: [text, tel, file, react_select, long_option_list, eeo]
    notes: >-
      The long-option-list case, and the longest single control in either bench file: "What is your
      current country of residence?" is a **197-option** required react-select, sitting next to a
      5-option "What country would you be working from if offered the role?" whose labels are
      *numbered* ("1 - United States", "2 - Canada", "3 - United Kingdom", "4 - Poland",
