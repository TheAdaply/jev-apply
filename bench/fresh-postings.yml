      quantitative free-text rows ("What percentage of time do you generally enjoy spending
      coding?", "How many years of industry experience do you have?") that are numbers asked as
      text. This posting carries **no** AI-usage attestation: the arbitration and certification
      rows are ordinary legal gates.

# What the live schemas reported across the twelve forms (2026-09-24).
control_summary:
  text: 12                # every form
  file: 12                # résumé upload on every form
  location: 11            # GH `#candidate-location` / Ashby `Location` autocomplete
  tel: 12
  eeo: 9                  # sensitive rows that must stay empty unless `p.eeo` is on file
  react_select: 6         # every hosted-Greenhouse row
  radio: 6                # every Ashby row
  checkbox_group: 6       # twilio(2×1-box, 9-box) gusto(11) notion(7) plaid(2×5) luma(4) openai(2×1-box)
  multi_select: 5         # pick-many, either rendering
  hear_about: 5           # referral-source question (checkbox group or react-select)
  long_option_list: 4     # >= 14 options in one control (197, 282, 14, 14)
  policy_gate: 6          # twilio remote(×3) vercel lambda openai(×2)
  dependent: 2            # remote-com (conditional textarea), harvey ("If you selected Other…")
  textarea: 3             # discord `why_us`, remote-com conditional, openai optional
  date: 1                 # openai — the only one on any fresh board
  essay: 1                # discord "Why do you want to work at Discord?" → writer path

coverage:
  postings: 12
  companies: 12           # every row a different employer
  families: 9             # ml_engineer(×2) backend(×2) security(×2) product_manager infra_sre
                          # data_engineer gpu_performance research_scientist research_engineer
  ml_research_inference: 5   # twilio gusto luma lambda openai
  backend_infra_data_security_pm: 7  # gitlab vercel discord remote-com gusto* plaid notion
  greenhouse: 6           # twilio gitlab gusto remote-com vercel discord
  ashby: 6                # notion harvey plaid lambda luma openai
  non_us: 4               # twilio(IE) notion(IE) gitlab(CA/PL/UK/US) remote-com(EMEA → country null)
  # Asked for and *not* found, with the evidence, rather than filled with a seen company:
  not_found:
    number: >-
      No fresh board carries one. 222 live postings were fetched through `loadFormPlan` on
      2026-09-24 (155 Ashby across 26 boards, 67 Greenhouse across 14 boards; three fetches timed
      out and are not counted) and not one reported `control:"number"`; exactly one reported
      `control:"date"`, the OpenAI row above. Across the whole 500-posting `corpus/`, only three companies ever ask a
      numeric field — confluent ("Location - Zip Code"), fireworks ("initial compensation
      expectations") and deepl — and all three are already in `bench/postings.yml`. The closest
      fresh substitutes are in the set anyway: Gusto's "Zip Code / Postal Code" and OpenAI's
      "percentage of time… coding" / "years of industry experience", all three numeric answers
      routed through `setText`.
