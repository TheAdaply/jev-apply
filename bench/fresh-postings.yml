  - url: https://job-boards.greenhouse.io/vercel/jobs/6199608004
    company: vercel
    family: infra_sre
    ats: greenhouse
    title: Software Engineer, Agentic Infrastructure
    questions: 24
    required: 12
    controls: [text, tel, file, react_select, checkbox_single, multi_select, location, hear_about, long_option_list, eeo]
