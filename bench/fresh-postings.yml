  - url: https://job-boards.greenhouse.io/discord/jobs/8656854002
    company: discord
    family: security
    ats: greenhouse
    title: Senior Software Engineer, Application Security
    questions: 25
    required: 17
    controls: [text, tel, file, textarea, essay, react_select, location, multi_select, eeo]
    notes: >-
      The EEO-survey stress case: **eleven** sensitive rows, ten of them required, and they come in
      two overlapping blocks — Discord asks Gender/Race/Veteran twice with different option sets
