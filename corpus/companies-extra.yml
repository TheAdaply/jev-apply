# jev-apply — extra boards for the question-bank corpus (docs/PLAN.md §2.7, scripts/canon-scan.mjs).
#
# private/companies-seed.yml is an AI/infra tracking list: it has no product managers, product
# designers, mobile engineers, analytics engineers or devrel/technical writers to speak of, and the
# question bank needs ≥20 real forms per family. These are large Greenhouse / Ashby / Lever users
# that do post those roles. They are corpus sources only — the discovery pipeline (§2.5) reads
# companies-seed.yml, not this file.
#
# Resolved live on 2026-09-22, same probe as the seed, one request per candidate slug:
#   greenhouse  GET https://boards-api.greenhouse.io/v1/boards/<token>/jobs   -> 200 + jobs[]
#   ashby       GET https://api.ashbyhq.com/posting-api/job-board/<org>       -> 200 + jobs[]
#   lever       GET https://api.lever.co/v0/postings/<site>?mode=json         -> 200 + [ ]
# `jobs_at_check` is that response's posting count; `families` is the four families the board
# contributes most postings to, per src/canon/families.mjs.
#
# Probed and NOT included: canva, doordash, atlassian, deel, grammarly, hashicorp, klarna, retool,
# revolut, snyk, unity (no public Greenhouse/Ashby/Lever board answered for any slug candidate).
# Rippling is excluded by instruction (its own ATS is not in the v1 provider set).
checked: 2026-09-22
