<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thank you for applying — jev-apply submit fixture</title>
<!--
  The confirmation `eval/fixtures/submit-form.html` lands on. It carries all three signals the
  three adapters look for, so one page proves every confirmation rule:

    #application_confirmation                    Greenhouse's confirmation block (selector rule)
    "Thank you for applying"                     Greenhouse's and the generic text rule
    "We've received your application"            Ashby's text rule
    no <form> and no submit control at all       the "form gone" half the generic and Ashby rules
                                                 require before any text counts as a receipt

  The URL deliberately does *not* contain "/confirmation": the text and selector rules have to
  carry this page on their own, which is the case that matters on the boards that confirm in
  place without navigating.
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 720px; }
  #application_confirmation { border: 1px solid #1a7f37; background: #f0fff4; padding: 18px 20px; }
  h1 { margin-top: 0; }
  .note { color: #666; }
</style>
</head>
<body>
<div id="application_confirmation">
  <h1>Thank you for applying</h1>
  <p>We've received your application for Senior Fixture Engineer at Fixture Corp.</p>
  <p class="note">Your application has been submitted. We will be in touch by email.</p>
</div>
</body>
</html>
